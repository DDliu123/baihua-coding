<script>
/* 主题需在首屏前生效，否则会闪一下白底 */
(function () {
  var mode = null;
  try { mode = localStorage.getItem('bhc-color-mode'); } catch (e) {}
  if (mode !== 'light' && mode !== 'dark') {
    mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  document.documentElement.dataset.colorMode = mode;
})();
(function () {
  var A = {
    indigo: { '--accent': '#4F46E5', '--accent-ink': '#4338CA', '--accent-soft': '#EEF0FF', '--accent-line': '#C7CCFF' },
    pine:   { '--accent': '#0F766E', '--accent-ink': '#115E59', '--accent-soft': '#E6F5F2', '--accent-line': '#A7DDD5' },
    plum:   { '--accent': '#9333EA', '--accent-ink': '#7E22CE', '--accent-soft': '#F6ECFE', '--accent-line': '#DCB8FB' },
    rust:   { '--accent': '#C2410C', '--accent-ink': '#9A3412', '--accent-soft': '#FDF0E6', '--accent-line': '#F5C39B' }
  };
  var id = 'indigo';
  try { id = localStorage.getItem('bhc-accent') || id; } catch (e) {}
  var v = Object.prototype.hasOwnProperty.call(A, id) ? A[id] : A.indigo;
  Object.keys(v).forEach(function (k) { document.documentElement.style.setProperty(k, v[k]); });
})();
</script>

        <button type="button" class="accent" data-accent="indigo" aria-label="靛蓝" aria-pressed="true"></button>
        <button type="button" class="accent" data-accent="pine" aria-label="松绿" aria-pressed="false"></button>
        <button type="button" class="accent" data-accent="plum" aria-label="紫梅" aria-pressed="false"></button>
        <button type="button" class="accent" data-accent="rust" aria-label="赤陶" aria-pressed="false"></button>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true" focusable="false">
